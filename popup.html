<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudette</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      background: #1a1a1a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 12px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #5a5a5a;
      margin: 10px 0 6px;
    }
    .section-label:first-child { margin-top: 0; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
    }

    .row.sub {
      padding-left: 12px;
      transition: opacity 0.15s;
    }
    .row.sub.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .label { color: #c8c8c8; font-size: 12px; }
    .row.sub .label { color: #9a9a9a; font-size: 11px; }
    .slow-note { color: #5a5a5a; font-size: 10px; margin-left: 4px; }

    .name-input {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 5px;
      color: #c8c8c8;
      font-size: 12px;
      padding: 4px 7px;
      width: 100px;
      text-align: right;
    }
    .name-input:focus { outline: none; border-color: #555; }

    .toggle-group {
      display: flex;
      background: #2a2a2a;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .toggle-group button {
      padding: 3px 10px;
      border: none;
      background: transparent;
      color: #8b8b8b;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .toggle-group button.active {
      background: #3a3a3a;
      color: #e8e8e8;
    }

    .switch {
      position: relative;
      width: 30px;
      height: 16px;
      flex-shrink: 0;
    }
    .switch input { display: none; }
    .switch-track {
      position: absolute;
      inset: 0;
      background: #2e2e2e;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .switch input:checked + .switch-track { background: #5a7a5a; }
    .switch-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: #6a6a6a;
      border-radius: 50%;
      transition: transform 0.15s, background 0.15s;
      pointer-events: none;
    }
    .switch input:checked ~ .switch-thumb {
      transform: translateX(14px);
      background: #a8c8a8;
    }

    .divider { height: 1px; background: #242424; margin: 8px 0; }

    .status {
      font-size: 10px;
      color: #5a5a5a;
      min-height: 14px;
      text-align: right;
      margin-top: 8px;
    }

    /* Progress mirror */
    .progress-section {
      margin-top: 8px;
    }
    .progress-label {
      font-size: 10px;
      color: #7a7a7a;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress-track {
      width: 100%;
      height: 3px;
      background: #2e2e2e;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #7a9a7a;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="section-label">Format</div>
  <div class="row">
    <span class="label">Output type</span>
    <div class="toggle-group">
      <button id="btn-md" class="active">MD</button>
      <button id="btn-txt">TXT</button>
    </div>
  </div>

  <div class="row">
    <span class="label">Your name <span class="slow-note">(in transcripts)</span></span>
    <input type="text" id="inp-username" class="name-input" placeholder="User" maxlength="40">
  </div>

  <div class="divider"></div>
  <div class="section-label">Content</div>

  <div class="row">
    <span class="label">Include thinking</span>
    <label class="switch">
      <input type="checkbox" id="tog-thinking">
      <div class="switch-track"></div>
      <div class="switch-thumb"></div>
    </label>
  </div>

  <div class="row">
    <span class="label">Include tool call summaries</span>
    <label class="switch">
      <input type="checkbox" id="tog-tools" checked>
      <div class="switch-track"></div>
      <div class="switch-thumb"></div>
    </label>
  </div>

  <div class="row sub" id="sub-bash">
    <span class="label">Include bash calls</span>
    <label class="switch">
      <input type="checkbox" id="tog-bash">
      <div class="switch-track"></div>
      <div class="switch-thumb"></div>
    </label>
  </div>

  <div class="row">
    <span class="label">Include images</span>
    <label class="switch">
      <input type="checkbox" id="tog-images" checked>
      <div class="switch-track"></div>
      <div class="switch-thumb"></div>
    </label>
  </div>

  <div class="row sub" id="sub-ocr">
    <span class="label">Use OCR on screenshots <span class="slow-note">(may be slow)</span></span>
    <label class="switch">
      <input type="checkbox" id="tog-ocr">
      <div class="switch-track"></div>
      <div class="switch-thumb"></div>
    </label>
  </div>

  <div class="row sub" id="sub-zip">
    <span class="label">Package images in ZIP</span>
    <label class="switch">
      <input type="checkbox" id="tog-zip" checked>
      <div class="switch-track"></div>
      <div class="switch-thumb"></div>
    </label>
  </div>

  <div class="divider"></div>
  <div class="section-label">Files</div>

  <div class="row">
    <span class="label">ZIP non-image files</span>
    <label class="switch">
      <input type="checkbox" id="tog-zip-files" checked>
      <div class="switch-track"></div>
      <div class="switch-thumb"></div>
    </label>
  </div>

  <div class="divider"></div>

  <div id="dev-section" style="display:none;">
    <div class="section-label" style="color:#7a6030;">
      <span style="background:#3a2800;color:#c8902a;border-radius:3px;padding:1px 5px;font-size:9px;letter-spacing:0.1em;margin-right:5px;">DEV</span>Experimental
    </div>
    <div class="row">
      <span class="label" style="color:#b89060;">Keep mic active on tab switch</span>
      <label class="switch">
        <input type="checkbox" id="tog-stt-persist">
        <div class="switch-track" style=""></div>
        <div class="switch-thumb"></div>
      </label>
    </div>
    <div class="divider"></div>
  </div>

  <div class="progress-section">
    <div class="progress-label" id="prog-label">Idle</div>
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill"></div>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;">
    <span id="version-badge" style="font-size:9px;color:#333;cursor:default;user-select:none;letter-spacing:0.04em;">v6.2.2.0</span>
    <div class="status" id="status" style="margin-top:0;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
