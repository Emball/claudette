<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claudette — Clean up a transcript</title>
<style>
  body { background:#1a1a1a; color:#e8e8e8; font:14px -apple-system,'Segoe UI',sans-serif; max-width:760px; margin:24px auto; padding:0 16px; }
  textarea { width:100%; height:200px; background:#1c1c1c; color:#c8c8c8; border:1px solid #333; border-radius:6px; padding:8px; font:12px monospace; box-sizing:border-box; }
  button { background:#3a3a3a; color:#e8e8e8; border:none; border-radius:5px; padding:7px 14px; cursor:pointer; margin:8px 8px 8px 0; }
  label { display:inline-block; margin:4px 14px 4px 0; font-size:13px; }
  #stats { color:#9a9a9a; font-size:12px; min-height:16px; }
</style>
</head>
<body>
  <h2>Clean up a transcript</h2>
  <p>Load an older Claudette export (or paste one) and apply the current settings to it.</p>
  <input type="file" id="file" accept=".md,.txt">
  <textarea id="input" placeholder="…or paste the transcript here"></textarea>
  <div id="opts"></div>
  <button id="run">Clean up</button><button id="download" disabled>Download</button><button id="copy" disabled>Copy</button>
  <div id="stats"></div>
  <textarea id="output" readonly></textarea>
  <script src="transcript.js"></script>
  <script src="transcript_import.js"></script>
</body>
</html>
